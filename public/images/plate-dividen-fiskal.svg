  <text x="880" y="380" fill="#141414" font-family="sans-serif" font-size="13.5" font-weight="700">Pasca UU No. 1/2025:</text>
  <text x="880" y="402" fill="#3A3A3A" font-family="sans-serif" font-size="13.5">Dividen ditahan dan dikelola</text>
  <text x="880" y="424" fill="#3A3A3A" font-family="sans-serif" font-size="13.5">oleh Danantara untuk modal</text>
  <text x="880" y="446" fill="#3A3A3A" font-family="sans-serif" font-size="13.5">investasi. Mekanisme kontrol</text>
  <text x="880" y="468" fill="#3A3A3A" font-family="sans-serif" font-size="13.5">parlemen bergeser ke luar APBN.</text>

