  <rect x="54" y="576" width="32" height="28" fill="#1E5C3A"/>
  <text x="100" y="595" fill="#E8E4DC" font-family="monospace" font-size="15" font-weight="700">Rp85,5 T (7 BUMN: Rp81,7 T / 95,6%)</text>

  <!-- Right forensic callout panel -->
  <rect x="850" y="112" width="302" height="492" fill="#191816" stroke="#3D3B36"/>
  <rect x="850" y="112" width="302" height="4" fill="#9E1B1B"/>
  <text x="872" y="148" fill="#9E1B1B" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1.5">CATATAN FORENSIK NERACA</text>
  <line x1="872" y1="164" x2="1130" y2="164" stroke="#3D3B36"/>

  <text x="872" y="198" fill="#F7F6F2" font-family="monospace" font-size="30" font-weight="700">59,3%</text>
  <text x="872" y="220" fill="#B8B3A8" font-family="sans-serif" font-size="13">Porsi aset 7 BUMN yang</text>
  <text x="872" y="238" fill="#B8B3A8" font-family="sans-serif" font-size="13">berada di 3 bank Himbara</text>
  <text x="872" y="256" fill="#B8B3A8" font-family="sans-serif" font-size="13">(Mandiri, BRI, BNI).</text>

  <line x1="872" y1="284" x2="1130" y2="284" stroke="#2C2B27"/>

  <text x="872" y="324" fill="#F7F6F2" font-family="monospace" font-size="30" font-weight="700">Rp81,7 T</text>
  <text x="872" y="346" fill="#B8B3A8" font-family="sans-serif" font-size="13">Dividen 7 BUMN 2024 yang</text>
  <text x="872" y="364" fill="#B8B3A8" font-family="sans-serif" font-size="13">sebelumnya masuk langsung</text>
  <text x="872" y="382" fill="#B8B3A8" font-family="sans-serif" font-size="13">ke kas APBN (PNBP KND).</text>

  <line x1="872" y1="410" x2="1130" y2="410" stroke="#2C2B27"/>

  <text x="872" y="446" fill="#E8E4DC" font-family="monospace" font-size="12" font-weight="700">SUMBER PRIMER:</text>
  <text x="872" y="468" fill="#A6A197" font-family="monospace" font-size="11">1. Laporan Keuangan 2024</text>
  <text x="872" y="486" fill="#A6A197" font-family="monospace" font-size="11">   7 BUMN Terkonsolidasi</text>
  <text x="872" y="508" fill="#A6A197" font-family="monospace" font-size="11">2. UU No. 1 Tahun 2025</text>
  <text x="872" y="526" fill="#A6A197" font-family="monospace" font-size="11">3. Rilis Setoran Dividen</text>
  <text x="872" y="544" fill="#A6A197" font-family="monospace" font-size="11">   Kementerian BUMN 2024</text>

  <text x="872" y="584" fill="#6E6A63" font-family="monospace" font-size="10">BONGKAR DANANTARA // DATA DESK</text>
</svg>
